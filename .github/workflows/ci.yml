# MediChain CI Workflow
# Runs on every push and pull request to main branch

name: MediChain CI

on:
    push:
        branches: [main, development/**]
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    # ============================================================================
    # Endpoint authorization gate (Horizon HZ-010 / HZ-019)
    # ----------------------------------------------------------------------------
    # MediChain authorizes per handler rather than at a runtime chokepoint. That
    # works, but a NEW handler can silently forget to check. This gate makes the
    # invariant enforceable: every HTTP handler must authenticate, authorize, or
    # be a justified entry in the script's public/delegated allowlists. A hard
    # gate on purpose — a new unprotected endpoint should fail the build, not a
    # review.
    # ============================================================================
    endpoint-auth:
        name: Endpoint authorization gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Every endpoint has an auth decision
              run: python scripts/check-endpoint-auth.py

            # The gate above asks "is there an authorization decision here". It
            # cannot see a decision that is present and too permissive — it
            # counted the telehealth recording endpoint as properly authorized
            # while `is_healthcare_provider()` was letting a pharmacist start
            # recording a patient's consultation. This one asks the narrower
            # question: does a state-changing handler rely on the widest
            # clinical predicate, and was that deliberate?
            - name: State-changing handlers narrow beyond "any clinical staff"
              run: python scripts/check-write-authorization.py

            # Both gates above look at the server. This one looks at the client:
            # the legacy `X-User-Id` header is a caller-supplied wallet address,
            # and the only module allowed to decide whether to send it is the
            # shared session helper. A page writing that literal itself sends the
            # identifier even when a Bearer session already carries it, and has
            # to be found again the day the legacy path is withdrawn.
            - name: Only the shared session helper emits the legacy identity header
              run: python scripts/check-legacy-identity-headers.py

            # The three gates above all ask whether a request was allowed to do
            # something. This one asks whether what it did actually happened.
            # `let _ = data.repositories.x.create(..)` type-checks, returns 200,
            # and stores nothing when the write fails — the caller is told the
            # lab result was filed, or the prescription transmitted to a
            # pharmacy, and neither is true. A ratchet, not a clean bill of
            # health: 55 such writes remain and the number may only fall.
            - name: No new repository write discards its own failure
              run: python scripts/check-discarded-writes.py

            - name: Required audit persistence results are never ignored
              run: python scripts/check-required-audit-results.py

            # `access_logs.action` has a CHECK constraint. A handler writing a
            # value outside it fails on PostgreSQL and nowhere else, because the
            # in-memory repository enforces no constraints — which is how
            # `lab_review_approve` went years without ever being a valid audit
            # action while every test passed. This derives the written
            # vocabulary from the Rust source rather than from a copy of the
            # constraint, so an omission common to both is still caught.
            - name: Every audit action the handlers write is permitted by the schema
              run: python scripts/check-audit-action-vocabulary.py

            # MediChain authenticates by proving control of a key. A "quick
            # login" list short-circuits that by naming an identity and asking
            # the app to become it — a bypass whether or not it currently
            # works, and the patient app shipped five of them. This also
            # asserts IS_DEVELOPMENT defaults to FALSE: it gates the
            # demo-identity paths, so any context without `import.meta.env`
            # would otherwise silently be a development build.
            - name: No sign-in path can hand out an unproven identity
              run: python scripts/check-quick-login-identities.py

            # The nursing dashboard rendered four hardcoded tasks — a dressing
            # change in 'Room 403', an IV assessment in 'ICU-2' — that existed
            # nowhere in the backend. A task list is a work instruction, and no
            # placeholder audit finds this: 'Room 403' matches no keyword and
            # looks exactly like real data. IS_DEMO-gated fallbacks are fine
            # (IS_DEMO defaults to false); ungated literals always render.
            - name: No production screen renders data nobody supplied
              run: python scripts/check-fabricated-ui-data.py

            # The idempotency middleware requires a header on every
            # authenticated mutation and was landed without migrating one
            # caller. The breakage surfaced four separate times, days apart,
            # each looking like an unrelated bug: the fixture seeder, thirty
            # raw-fetch sites in the portals, the synthetic e2e harness (which
            # is what failed hosted CI), and the demo setup script DEMO_SETUP.md
            # tells a human to run, which created nothing and printed a success
            # banner anyway. None of that fails at compile time or in a Rust
            # test. Baseline is zero, so the next one fails here instead.
            - name: Every authenticated mutation sends an idempotency key
              run: python scripts/check-idempotency-callers.py

            # A Prometheus job that scrapes /api/metrics without a credential
            # does not fail loudly: the target sits at `down` with 401 and only
            # somebody opening the Prometheus UI ever finds out. Metrics silence
            # is the one failure that cannot page anybody about itself, and this
            # deployment had been in exactly that state.
            - name: Monitoring config presents a credential for protected endpoints
              run: python scripts/check-metrics-scrape-auth.py

            # ----------------------------------------------------------------
            # Five gates below existed, passed, and ran NOWHERE. A ratchet that
            # is not in CI is not a ratchet -- it is a script somebody has to
            # remember, and the whole point of a baseline is that nobody has to.
            # `check-state-durability.py` is the starkest: it is the guarantee
            # that clinical handlers keep writing through repositories rather
            # than into process memory, the single defect class this codebase
            # has had most of, and nothing was enforcing it between commits.
            # ----------------------------------------------------------------

            # Clinical writes must reach a repository, never an AppState map.
            # Baseline is 0 references; it may only stay there.
            - name: No handler writes clinical state into process memory
              run: python scripts/check-state-durability.py

            # Frontend paths must match registered backend routes. Whole feature
            # clusters once pointed at endpoints that did not exist.
            - name: Frontend calls resolve to registered endpoints
              run: python scripts/check-endpoint-drift.py

            # A security control whose default is permissive is not a control.
            - name: Security-relevant defaults fail closed
              run: python scripts/check-uncontrolled-defaults.py

            # WCAG AA contrast, checked at the design tokens rather than at a
            # rendered pixel, so it holds for both themes.
            - name: Colour tokens meet WCAG AA contrast
              run: python scripts/check-contrast.py

            # Test files that no longer match the components they name.
            - name: Frontend tests have not drifted from their components
              run: python scripts/check-frontend-test-drift.py

    # ============================================================================
    # Rust Backend (Substrate pallets, API, crypto, node)
    # ============================================================================
    rust:
        name: Rust CI
        runs-on: ubuntu-latest

        # The four `repositories::postgres::tests` need a live database. Without
        # this service they do not skip — they FAIL, with `PoolTimedOut` after a
        # 30s connect timeout each. Mirrors verification.yml's service so the two
        # workflows exercise the same tests against the same database, rather
        # than one quietly covering less than the other.
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: medichain
                    POSTGRES_PASSWORD: medichain_dev_2024
                    POSTGRES_DB: medichain
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U medichain -d medichain"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgres://medichain:medichain_dev_2024@localhost:5432/medichain

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Check formatting
              run: cargo fmt --all -- --check

            # BLOCKING as of 2026-08-27. It was report-only pending a ~238-finding
            # cleanup; those are gone and `--all-targets --all-features -D warnings`
            # exits 0.
            #
            # Leaving it advisory had a cost beyond untidiness. `--all-features`
            # enables `tokio-console`, and the nine dead-code findings that
            # combination produced were not dead code -- they were the privacy
            # redaction module being switched off for that build. A lint nobody
            # is required to read reported a disabled PHI control for days.
            - name: Run Clippy (linting)
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Build
              run: cargo build --release

            # The PostgreSQL service declared on this job supplies DATABASE_URL,
            # so the repository tests run for real here rather than failing on a
            # connect timeout. (This comment previously said such a job was still
            # "tracked" — it is the service above.)
            - name: Run tests
              run: cargo test

            - name: Install cargo-audit
              run: cargo install cargo-audit

            # Report-only: the substrate/subxt transitive tree carries upstream
            # advisories we don't directly control (mirrors the supply-chain job).
            - name: Security audit (report-only)
              continue-on-error: true
              run: cargo audit

    # ============================================================================
    # Blockchain workspace (pallets + runtime + node)
    # ----------------------------------------------------------------------------
    # `blockchain/` is a SEPARATE cargo workspace on a different Polkadot SDK
    # release from the API. That matters for CI correctness: the `rust` job above
    # runs `cargo fmt --all` / `cargo clippy --all-targets` / `cargo test` with no
    # `-p` flags, so it only ever sees the root workspace. When the pallets moved
    # out of it they left that job's scope entirely, and a workspace-scoped
    # command reports success for crates it never compiled. Without this job the
    # 60 pallet tests would simply stop running and nothing would go red.
    # ============================================================================
    blockchain:
        name: Blockchain (pallets + runtime)
        runs-on: ubuntu-latest

        env:
            # REQUIRED. The repository root has its own rust-toolchain.toml pinning
            # `channel = "stable"`, and rustup resolves the nearest such file
            # walking up from the working directory. Because cargo is invoked from
            # the repo root via --manifest-path, that root file outranks both the
            # toolchain action below and blockchain/rust-toolchain.toml.
            # RUSTUP_TOOLCHAIN outranks the files, so it is what actually pins the
            # compiler here. Without it the build runs on `stable`, which has
            # neither the wasm targets nor rust-src.
            RUSTUP_TOOLCHAIN: '1.92.0'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # `rust-src` is not optional: substrate-wasm-builder compiles the
            # runtime with `-Z build-std` and fails outright without the standard
            # library sources.
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@1.92.0
              with:
                  components: rustfmt, clippy, rust-src
                  targets: wasm32v1-none, wasm32-unknown-unknown

            # clang/libclang are required by the rocksdb bindgen build in the
            # node's dependency tree; protobuf by the networking stack.
            - name: Install native build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y protobuf-compiler libprotobuf-dev clang libclang-dev

            - name: Cache cargo registry and build
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      blockchain/target
                  # Image and toolchain are in the key on purpose; see the long
                  # note in blockchain-node-release.yml. `runner.os` alone is
                  # "Linux" for every Ubuntu image, so a cache built on one can be
                  # restored onto another with an incompatible glibc.
                  key: ${{ runner.os }}-ubuntu-latest-rust1.92.0-blockchain-${{ hashFiles('blockchain/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-ubuntu-latest-rust1.92.0-blockchain-

            - name: Check formatting
              run: cargo fmt --manifest-path blockchain/Cargo.toml --all -- --check

            # Enforced here, unlike the root `rust` job's clippy, which is
            # deliberately report-only while pre-existing findings are worked down.
            # This code is new, so it starts clean and stays clean.
            - name: Clippy (enforced)
              run: >-
                  cargo clippy --manifest-path blockchain/Cargo.toml
                  --workspace --all-targets -- -D warnings

            - name: Build runtime (generates WASM)
              run: cargo check --manifest-path blockchain/Cargo.toml -p medichain-runtime

            - name: Build node
              run: cargo check --manifest-path blockchain/Cargo.toml -p medichain-node

            # Guards the role-bootstrap regression: pallet-access-control's genesis
            # config is the only way UserRoles can ever be populated.
            - name: Run blockchain tests
              run: cargo test --manifest-path blockchain/Cargo.toml --workspace

    # ============================================================================
    # Supply-Chain Security (cargo-deny advisories/licenses/bans + SBOM)
    # ============================================================================
    supply-chain:
        name: Supply Chain
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            # Enforced (under our control): no banned crates, crates.io sources only.
            # Config lives in deny.toml at the repo root.
            - name: cargo-deny (bans + sources, enforced)
              uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  command: check
                  command-arguments: bans sources

            # Advisories: ENFORCED as of 2026-08-25. Every RUSTSEC ID in the root
            # tree is either absent, fixed, or an explicit reasoned acceptance
            # with a removal criterion; deny.toml also fails on a stale
            # acceptance, so that list can only describe the present.
            #
            # Understand the failure mode before relaxing this. The advisory
            # database is fetched at run time, so a NEW advisory published
            # against any dependency turns this red on a PR that changed
            # nothing. That is the gate working, not a flake. The fix is the
            # upgrade, or a reasoned entry with a removal criterion. It is not
            # continue-on-error.
            - name: cargo-deny (advisories, enforced)
              uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  command: check
                  command-arguments: advisories

            # ----------------------------------------------------------------
            # The SAME checks over the `blockchain/` workspace.
            #
            # Everything above runs from the repo root, so it only ever sees the
            # root workspace -- exactly the scoping trap the `blockchain` job's
            # header describes for tests. Until this step existed, all 1171
            # locked dependencies of the node and runtime (the whole Substrate
            # networking, consensus and crypto stack) went unscanned: no
            # advisories, no licence review, no source pinning. The API's much
            # smaller tree was fully covered, which made the gap easy to miss.
            #
            # Config: blockchain/deny.toml (separate from the root's on purpose
            # -- the Polkadot SDK ships GPL crates the root's permissive-only
            # allow-list would reject outright).
            # ----------------------------------------------------------------
            - name: cargo-deny blockchain (sources, enforced)
              uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  manifest-path: blockchain/Cargo.toml
                  command: check
                  command-arguments: sources

            # Advisories: ENFORCED for the blockchain tree as of 2026-08-26.
            #
            # This was report-only while the graph reported 5 vulnerabilities
            # and 2 unmaintained crates. It no longer does. One left by a
            # precise lockfile bump (h2 0.4.15 -> 0.4.19, RUSTSEC-2026-0258);
            # the remaining five are reasoned acceptances in
            # blockchain/deny.toml, each quoting the upstream constraint that
            # blocks it and naming the single condition that removes it.
            #
            # Enforcing it is now the cheaper option, not the stricter one: a
            # report-only gate on a graph nobody can currently fix trains
            # reviewers to scroll past it, and the root gate had to be rescued
            # from exactly that. blockchain/deny.toml also now sets
            # unused-ignored-advisory = "deny", so an acceptance whose crate
            # leaves the tree fails the build instead of becoming a stale
            # comment.
            #
            # Expect this to go red one day on a PR that changed nothing: the
            # advisory database is fetched at run time. That is the gate
            # working. The fix is an upgrade or a reasoned entry, never
            # continue-on-error.
            - name: cargo-deny blockchain (advisories, enforced)
              uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  manifest-path: blockchain/Cargo.toml
                  command: check
                  command-arguments: advisories

            # Licences stay report-only, and only licences.
            #
            # The allow-list was derived offline from 1074 of the 1171 locked
            # packages — the remaining 97 were not in the local registry cache —
            # so it is still a discovery gate rather than a complete one.
            # Enforcing an incomplete allow-list would fail on crates nobody has
            # reviewed yet, which says nothing about whether their licences are
            # acceptable. Flip it once a full CI run confirms the list covers
            # all 1171. `bans` is warn-level by config, not a failure.
            - name: cargo-deny blockchain (licences, report-only — allow-list incomplete)
              uses: EmbarkStudios/cargo-deny-action@v2
              continue-on-error: true
              with:
                  manifest-path: blockchain/Cargo.toml
                  command: check
                  command-arguments: licenses bans

            # Licenses: ENFORCED as of 2026-08-25. Kept as its own step so a new
            # licence problem and a new advisory fail separately and read
            # separately.
            #
            # MediChain's own crates are proprietary and unpublished, so they
            # carry license-file rather than an SPDX id and are skipped via
            # private.ignore. Third-party policy is unchanged and permissive-
            # only, with one reviewed package-scoped exception (the Mozilla CA
            # dataset under CDLA-Permissive-2.0). deny.toml fails on an
            # exception that no longer matches a crate, so an upgrade dropping
            # that dependency also forces the exception out.
            - name: cargo-deny (licenses, enforced)
              uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  command: check
                  command-arguments: licenses

            # Generate a CycloneDX Software Bill of Materials for compliance.
            - name: Install cargo-cyclonedx
              run: cargo install cargo-cyclonedx --locked

            - name: Generate SBOM (CycloneDX)
              run: cargo cyclonedx --format json --all

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sbom-cyclonedx
                  path: "**/*.cdx.json"
                  if-no-files-found: warn

    # The runtime image must identify the exact source revision it was built
    # from. This job does not publish a release artifact; it validates the
    # source-to-image link that a release workflow must preserve.
    api-image-provenance:
        name: API image provenance
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build API image with source revision
              run: >-
                  docker build
                  --build-arg SOURCE_REVISION=${{ github.sha }}
                  --label org.opencontainers.image.revision=${{ github.sha }}
                  -f api/Dockerfile
                  -t medichain-api:${{ github.sha }}
                  .

            - name: Verify image revision label
              run: |
                  actual="$(docker image inspect medichain-api:${{ github.sha }} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
                  test "$actual" = "${{ github.sha }}"

            # Record the digest, not just the label.
            #
            # "The label says the right SHA" proves the build was TOLD its
            # source revision. It does not identify the image that came out.
            # Without a recorded digest there is nothing to point at later and
            # say "this artifact is the one that passed these gates" — a
            # release can only claim provenance for an artifact it can name.
            #
            # This job still does not publish. What it produces is the
            # source-SHA-to-image-digest link that a publishing workflow must
            # carry forward, written where a human and a later job can both
            # read it.
            - name: Record source revision to image digest
              id: digest
              run: |
                  digest="$(docker image inspect medichain-api:${{ github.sha }} --format '{{ .Id }}')"
                  echo "image_digest=${digest}" >> "$GITHUB_OUTPUT"
                  printf '%s\n' \
                    "source_revision=${{ github.sha }}" \
                    "image_digest=${digest}" \
                    "image_tag=medichain-api:${{ github.sha }}" \
                    "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    "workflow_run=${{ github.run_id }}" \
                    > image-provenance.txt
                  {
                    echo "### API image provenance"
                    echo
                    echo "| field | value |"
                    echo "| --- | --- |"
                    echo "| source revision | \`${{ github.sha }}\` |"
                    echo "| image digest | \`${digest}\` |"
                    echo "| workflow run | ${{ github.run_id }} |"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload image provenance record
              uses: actions/upload-artifact@v4
              with:
                  name: api-image-provenance
                  path: image-provenance.txt
                  if-no-files-found: error

    # ============================================================================
    # Snyk (11.2) — dependency vulnerability scanning, Rust + frontend.
    # Needs a SNYK_TOKEN repo secret (Settings → Secrets and variables → Actions)
    # and the SNYK_ENABLED repo variable set to "true" to activate — deliberately
    # opt-in so adding the token alone doesn't start failing builds before it's
    # configured the way this team wants (severity threshold, project scope).
    # ============================================================================
    snyk:
        name: Snyk
        runs-on: ubuntu-latest
        if: ${{ vars.SNYK_ENABLED == 'true' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Snyk — Rust dependencies (Cargo.lock)
              continue-on-error: true
              uses: snyk/actions/rust@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  args: --severity-threshold=high

            # NO `working-directory:` HERE. It is valid only on `run:` steps, and
            # putting it on a `uses:` step makes GitHub reject the ENTIRE workflow
            # file before running anything — every job in this file, not just this
            # one, and not just this job's own failure. That is exactly what
            # happened: this workflow failed in 0s on every push from 2026-07-27
            # to 2026-08-05 and not one of its eight jobs ever ran, including the
            # endpoint-authorization gate and the dual-backend e2e matrix.
            #
            # It went unnoticed because `verification.yml` publishes checks named
            # "Rust format and tests" and "Client builds", which are green and read
            # like full CI coverage at a glance.
            #
            # Note this job is `if:`-disabled by default, so an invalid key in a
            # job that never runs still took down everything else.
            #
            # `--all-projects` scans from the repository root and picks up
            # client/**/package.json anyway, so no directory change is needed.
            - name: Snyk — frontend dependencies (npm)
              continue-on-error: true
              uses: snyk/actions/node@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  command: test
                  args: --severity-threshold=high --all-projects

    # ============================================================================
    # TypeScript/React Client Apps (doctor-portal, patient-app)
    # ============================================================================
    client:
        name: Client CI
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: client

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build doctor portal
              run: npm run build:doctor

            - name: Build patient app
              run: npm run build:patient

            - name: Run linting
              run: npm run lint --workspaces --if-present

    # ============================================================================
    # Performance budgets — Lighthouse CI (Phase 12.1)
    # ============================================================================
    # Report-only for now (perf is environment-noisy in CI); budgets live in
    # client/.lighthouserc.json and docs/PERFORMANCE_BUDGETS.md.
    lighthouse:
        name: Lighthouse Budgets
        runs-on: ubuntu-latest
        continue-on-error: true

        defaults:
            run:
                working-directory: client

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build patient app
              run: npm run build:patient

            - name: Install Lighthouse CI
              run: npm install -g @lhci/cli@0.13.x

            - name: Run Lighthouse CI (patient app)
              run: lhci autorun --config=.lighthouserc.json --collect.staticDistDir=patient-app/dist

    # ============================================================================
    # WebAssembly Crypto Module
    # ============================================================================
    wasm:
        name: WASM Crypto CI
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM module
              working-directory: client/wasm-crypto
              run: wasm-pack build --target web

            - name: Run WASM tests
              working-directory: client/wasm-crypto
              run: wasm-pack test --node

    # ============================================================================
    # End-to-end suite against BOTH storage backends.
    #
    # This job exists because running the suite on the memory backend alone hid a
    # completely broken PostgreSQL path for the life of the project. Memory is a
    # HashMap: no column widths, no type coercion, no CHECK constraints. Every
    # end-to-end assertion ran against it, so PostgreSQL-only failures were
    # invisible until the backend was first exercised — at which point patient
    # registration turned out to be impossible (a 64-char SHA3 hash into a
    # VARCHAR(32)), four repository methods were unimplemented, and 16 actor
    # columns were typed uuid while the application writes wallet addresses.
    #
    # The matrix is the point: a defect that only appears on one backend must
    # fail the build. `scripts/synthetic-e2e-test.sh` already parameterises
    # BASE, so this needed no new test code.
    # ============================================================================
    e2e-both-backends:
        name: E2E (${{ matrix.backend }} backend)
        runs-on: ubuntu-latest

        strategy:
            # Always run both legs — knowing ONLY that postgres broke, without
            # knowing whether memory also broke, makes triage guesswork.
            fail-fast: false
            matrix:
                backend: [memory, postgres]

        services:
            # Started for both legs; the memory leg simply ignores it. Keeping
            # the matrix legs otherwise identical means a difference in results
            # is a difference in the BACKEND, not in the environment.
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: medichain
                    POSTGRES_PASSWORD: medichain_ci
                    POSTGRES_DB: medichain
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U medichain"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

            # Without IPFS the suite SKIPS its whole encrypted-record section
            # (upload -> encrypt -> IPFS -> download -> decrypt) rather than
            # failing, so a regression there would go unnoticed while the job
            # still reported green. A skipped section is not a passing one.
            ipfs:
                image: ipfs/kubo:v0.29.0
                ports:
                    - 5001:5001
                    - 8080:8080

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            # The suite's `jget` helper shells out to `python`, which does not
            # exist on ubuntu-latest by default (only `python3`).
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Build API
              run: cargo build --bin medichain-api

            # Two explicit steps rather than one with conditional env. An
            # empty-string MEDICHAIN_STORAGE/DATABASE_URL is SET-but-empty, not
            # unset: the memory leg would still try to open a connection to ""
            # and log a connection failure, which is noise that looks like a
            # defect. Being explicit costs a few lines and removes the ambiguity.
            - name: Start API (memory backend)
              if: matrix.backend == 'memory'
              env:
                  IS_DEMO: "true"
                  MEDICHAIN_DEV_MODE: "true"
                  REQUIRE_SIGNATURES: "false"
                  BLOCKCHAIN_ENABLED: "false"
                  MEDICHAIN_BOOTSTRAP_KEY: synthetic-test-bootstrap-key-2026
                  PORT: "8090"
                  HOST: 127.0.0.1
                  RUST_LOG: warn
                  # 127.0.0.1, not `localhost`: the latter can resolve to ::1
                  # first and the published port is not reachable there.
                  IPFS_API_URL: http://127.0.0.1:5001
                  IPFS_GATEWAY_URL: http://127.0.0.1:8080
              run: ./scripts/ci-start-api.sh

            - name: Start API (postgres backend)
              if: matrix.backend == 'postgres'
              env:
                  IS_DEMO: "true"
                  MEDICHAIN_DEV_MODE: "true"
                  REQUIRE_SIGNATURES: "false"
                  BLOCKCHAIN_ENABLED: "false"
                  MEDICHAIN_BOOTSTRAP_KEY: synthetic-test-bootstrap-key-2026
                  PORT: "8090"
                  HOST: 127.0.0.1
                  RUST_LOG: warn
                  MEDICHAIN_STORAGE: postgres
                  DATABASE_URL: postgres://medichain:medichain_ci@127.0.0.1:5432/medichain
              run: ./scripts/ci-start-api.sh

            # Migrations must APPLY, not merely be attempted. sqlx halts the
            # whole chain if one already-applied migration's checksum changed,
            # and in demo mode that is a warning rather than an abort — which is
            # exactly how this database drifted 31 migrations behind the code
            # without anyone noticing.
            - name: Assert migrations applied (postgres only)
              if: matrix.backend == 'postgres'
              run: |
                  if grep -q "DATABASE MIGRATIONS DID NOT APPLY" /tmp/api.log; then
                      echo "::error::Migrations did not apply — schema does not match the code"
                      grep -A 6 "DATABASE MIGRATIONS DID NOT APPLY" /tmp/api.log
                      exit 1
                  fi
                  echo "migrations applied cleanly"

            - name: Synthetic end-to-end suite
              run: BASE=http://127.0.0.1:8090 bash scripts/synthetic-e2e-test.sh

            - name: Cross-patient IDOR sweep
              run: BASE=http://127.0.0.1:8090 bash scripts/idor-sweep.sh

            - name: API log on failure
              if: failure()
              run: tail -100 /tmp/api.log

            - name: Stop API
              if: always()
              run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true
